    <!-- START OF CUSTOM JAVASCRIPT FOR CHECKBOX LOGIC --><script>
        document.addEventListener('DOMContentLoaded', function() {
            const allCheckbox = document.getElementById('checkbox-33971183-13-0');
            const individualCheckboxes = [
                document.getElementById('checkbox-33971183-13-1'), // News
                document.getElementById('checkbox-33971183-13-2'), // Offers
                document.getElementById('checkbox-33971183-13-3')  // Play Test
            ];

            if (allCheckbox) {
                // Function to set the disabled state of the individual checkboxes
                function setIndividualDisabled(disabled) {
                    individualCheckboxes.forEach(checkbox => {
                        if (checkbox) {
                            checkbox.disabled = disabled;
                            // Ensure the visual state is updated
                            if (disabled) {
                                // If disabling, uncheck them to prevent conflicting data
                                checkbox.checked = false;
                            }
                            // Re-apply the classes to trigger any dependent styling
                            checkbox.parentElement.classList.toggle('disabled', disabled);
                        }
                    });
                }

                // Initial check when the page loads
                setIndividualDisabled(allCheckbox.checked);

                // Event listener for the "All" checkbox
                allCheckbox.addEventListener('change', function() {
                    setIndividualDisabled(this.checked);
                });

                // Event listener for individual checkboxes (if clicked, "All" should uncheck)
                individualCheckboxes.forEach(checkbox => {
                    if (checkbox) {
                        checkbox.addEventListener('change', function() {
                            if (allCheckbox.checked && this.checked) {
                                allCheckbox.checked = false;
                                setIndividualDisabled(false); // Enable others if "All" is manually unchecked by clicking another
                            }
                        });
                    }
                });
            }
        });
    </script>
